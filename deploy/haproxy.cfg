global
  log stdout format raw local0
  maxconn 1024
defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 65s
  timeout server 65s
frontend medicalsys
  # Internal listener behind a TLS-terminating gateway; do not expose HTTP
  # directly to patients. Only the gateway may connect to this listener.
  bind :8080
  default_backend api_instances
backend api_instances
  balance roundrobin
  option httpchk
  http-check send meth GET uri /api/ready hdr Host localhost hdr X-Forwarded-Proto https
  http-check expect status 200
  # Do not replay a request sent to a server: write outcomes may be ambiguous.
  retries 0
  server api1 127.0.0.1:3001 check inter 2s fall 2 rise 2
  server api2 127.0.0.1:3002 check inter 2s fall 2 rise 2
